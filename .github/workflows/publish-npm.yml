name: Release to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use current npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm install

      - name: Resolve release metadata
        id: release_meta
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          if [[ "${version}" == *-* ]]; then
            dist_tag="preview"
            prerelease="true"
          else
            dist_tag="latest"
            prerelease="false"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${dist_tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Ensure tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="${{ steps.release_meta.outputs.version }}"
          if [[ "${expected}" != "${actual}" ]]; then
            echo "Tag version (${expected}) does not match package.json version (${actual})." >&2
            exit 1
          fi

      - name: Run quality checks
        run: npm run quality

      - name: Check whether npm version already exists
        id: npm_version_check
        run: |
          version="${{ steps.release_meta.outputs.version }}"
          if npm view "@analyticscli/sdk@${version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        id: publish_step
        if: steps.npm_version_check.outputs.already_published != 'true'
        run: |
          publish_output="$(mktemp)"
          set +e
          env -u NODE_AUTH_TOKEN npm publish --access public --tag "${{ steps.release_meta.outputs.dist_tag }}" --provenance 2>&1 | tee "${publish_output}"
          publish_exit=$?
          set -e

          if [[ ${publish_exit} -eq 0 ]]; then
            exit 0
          fi

          if grep -Fq "You cannot publish over the previously published versions" "${publish_output}"; then
            echo "Version ${{ steps.release_meta.outputs.version }} became already published while workflow was running; continuing."
            exit 0
          fi

          exit "${publish_exit}"

      - name: Verify npm package and dist-tag
        env:
          PACKAGE_NAME: '@analyticscli/sdk'
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
        run: |
          for attempt in {1..18}; do
            if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
              effective_tag="$(npm view "${PACKAGE_NAME}" "dist-tags.${RELEASE_DIST_TAG}" --json 2>/dev/null || true)"
              effective_tag="${effective_tag//\"/}"
              if [[ "${effective_tag}" == "${RELEASE_VERSION}" ]]; then
                npm view "${PACKAGE_NAME}" version dist-tags --json
                exit 0
              fi
              echo "npm package visible, waiting for dist-tag ${RELEASE_DIST_TAG}=${RELEASE_VERSION}; retry ${attempt}/18"
            else
              echo "npm package not visible yet; retry ${attempt}/18"
            fi
            sleep 10
          done

          echo "Package or dist-tag is still not visible on npm after retries." >&2
          exit 1

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_DIST_TAG: ${{ steps.release_meta.outputs.dist_tag }}
          RELEASE_IS_PRERELEASE: ${{ steps.release_meta.outputs.prerelease }}
          RELEASE_ALREADY_PUBLISHED: ${{ steps.npm_version_check.outputs.already_published }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          notes_file="$(mktemp)"
          npm_url="https://www.npmjs.com/package/@analyticscli/sdk/v/${RELEASE_VERSION}"
          {
            echo "Published to npm as [@analyticscli/sdk@${RELEASE_VERSION}](${npm_url})."
            echo
            echo "npm dist-tag: \`${RELEASE_DIST_TAG}\`."
            if [[ "${RELEASE_ALREADY_PUBLISHED}" == "true" ]]; then
              echo
              echo "Publish step was skipped because this version was already present on npm."
            fi
          } > "${notes_file}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            edit_args=(release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file "${notes_file}")
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              edit_args+=(--prerelease)
            fi
            gh "${edit_args[@]}"
          else
            create_args=(release create "${RELEASE_TAG}" --target "${RELEASE_COMMIT}" --title "${RELEASE_TAG}" --notes-file "${notes_file}")
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
          fi
